services:
  - type: web
    name: wayfleet-realtime
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm run realtime
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: REALTIME_SERVER_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
      - key: REALTIME_CORS_ORIGIN
        sync: false
